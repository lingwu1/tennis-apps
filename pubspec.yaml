name: apps
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.2
  camera: ^0.10.5+9
  permission_handler: ^11.3.1
  file_picker: ^8.0.0+1
  http: ^1.2.0
  path_provider: ^2.1.2
  dio: ^5.4.0
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/

flutter_native_splash:
  # 使用loading.jpg作为背景图片
  image: assets/images/loading.jpg
  
  # 背景颜色 - 与应用主题色一致
  color: "#F4F5F7"
  
  # 颜色配置
  color_dark: "#F4F5F7"
  
  # 平台特定配置
  android_12:
    image: assets/images/loading.jpg
    icon_background_color: "#B7CC54"
    icon_background_color_dark: "#B7CC54"
  
  # 全屏模式
  fullscreen: true
  
  # 图片填充模式
  image_dark: assets/images/loading.jpg

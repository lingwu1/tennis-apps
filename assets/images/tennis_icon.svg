<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="60" cy="60" r="60" fill="#B7CC54"/>
  
  <!-- 网球图标 -->
  <g transform="translate(30, 30)">
    <!-- 网球主体 -->
    <ellipse cx="30" cy="30" rx="25" ry="25" fill="white"/>
    
    <!-- 网球纹理线 -->
    <path d="M 5 30 Q 30 5 55 30" stroke="#B7CC54" stroke-width="2" fill="none"/>
    <path d="M 5 30 Q 30 55 55 30" stroke="#B7CC54" stroke-width="2" fill="none"/>
    <path d="M 30 5 Q 5 30 30 55" stroke="#B7CC54" stroke-width="2" fill="none"/>
    <path d="M 30 5 Q 55 30 30 55" stroke="#B7CC54" stroke-width="2" fill="none"/>
    
    <!-- 中心点 -->
    <circle cx="30" cy="30" r="3" fill="#B7CC54"/>
  </g>
</svg>